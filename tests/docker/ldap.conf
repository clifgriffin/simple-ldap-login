include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
include /etc/ldap/schema/nis.schema
pidfile /var/run/slapd/slapd.pid
argsfile /var/run/slapd/slapd.args
modulepath /usr/lib/ldap
moduleload back_mdb
TLSCertificateFile /var/lib/ldap/tls/server.crt
TLSCertificateKeyFile /var/lib/ldap/tls/server.key
TLSCACertificateFile /certs/ca.crt
# Permit the explicit legacy plaintext test on this private fixture only.
security simple_bind=0
database mdb
maxsize 10485760
suffix "dc=example,dc=test"
rootdn "cn=admin,dc=example,dc=test"
rootpw Test-Directory-Root-42!
directory /var/lib/ldap
index objectClass eq
access to attrs=userPassword by self write by anonymous auth by * none
access to * by * read
